openapi: 3.0.3
info:
  title: Expense API
  version: "0.1.0"
  description: Shared household expense pool, categories, limits, and totals.
servers:
  - url: /
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        limitUsd: { type: number, nullable: true, description: monthly spending limit in USD }
    Expense:
      type: object
      required: [id, categoryId, amount, currency, expenseDate, amountUsd]
      properties:
        id: { type: string }
        categoryId: { type: string }
        amount: { type: number, description: amount in the currency actually paid }
        currency: { type: string, description: ISO 4217 currency code paid }
        amountUsd: { type: number, description: amount converted to household base currency (USD) }
        expenseDate: { type: string, format: date, description: local date the expense was logged on }
        loggedTimezone: { type: string, description: IANA timezone active when the expense was logged }
        createdAt: { type: string, format: date-time }
    ExpenseInput:
      type: object
      required: [categoryId, amount, currency, expenseDate, loggedTimezone]
      properties:
        categoryId: { type: string }
        amount: { type: number }
        currency: { type: string }
        expenseDate: { type: string, format: date }
        loggedTimezone: { type: string }
    CategoryTotal:
      type: object
      required: [categoryId, categoryName, totalUsd, status]
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        totalUsd: { type: number }
        limitUsd: { type: number, nullable: true }
        status: { type: string, enum: [ok, near, over], description: limit status when limitUsd is set }
    PeriodTotal:
      type: object
      required: [period, totalUsd]
      properties:
        period: { type: string, description: "e.g. 2026-09-04, 2026-W36, 2026-09" }
        totalUsd: { type: number }
security:
  - bearerAuth: []
paths:
  /expenses:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listExpenses
      summary: List expenses in the shared household pool
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Matching expenses
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Expense' } }
        '401': { description: missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: createExpense
      summary: Log a new expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '201':
          description: Expense created, converted to USD using the rate on expenseDate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { description: invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/ExpenseId'
    put:
      operationId: updateExpense
      summary: Edit an expense in the shared pool
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseInput' }
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Expense' }
        '400': { description: invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: expense not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteExpense
      summary: Delete an expense from the shared pool
      responses:
        '204': { description: deleted }
        '404': { description: expense not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /categories:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listCategories
      summary: List expense categories
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Category' } }
    post:
      operationId: createCategory
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                limitUsd: { type: number, nullable: true }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { description: invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/CategoryId'
    put:
      operationId: updateCategory
      summary: Rename a category or change its limit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                limitUsd: { type: number, nullable: true }
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '404': { description: category not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteCategory
      summary: Remove a category
      responses:
        '204': { description: deleted }
        '404': { description: category not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /totals:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getPeriodTotals
      summary: Get daily, weekly, or monthly expenditure totals in USD
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Totals per period bucket
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PeriodTotal' }
        '400': { description: invalid period, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /categories/totals:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getCategoryTotals
      summary: Get spending totals per category with limit status
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly] }
      responses:
        '200':
          description: Per-category totals against each category's limit
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryTotal' }
        '400': { description: invalid period, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
